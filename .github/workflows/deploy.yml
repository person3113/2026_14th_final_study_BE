name: Docker & GitHub Actions CI/CD Pipeline

on:
  push:
    branches:
      - "week8/**" # 개인 개발 작업 브랜치 푸시 시 자동 감지 및 배포 가동

permissions:
  contents: read
  packages: write # GHCR(GitHub Packages) 이미지 업로드를 위해 쓰기 권한 설정

jobs:
  # 1. 빌드 및 테스트 자동 검증 (CI)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Build and Tests
        run: ./gradlew build --no-daemon

  # 2. Docker 이미지화 및 배포 자동화 (CD)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # GitHub Container Registry (GHCR) 로그인
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Buildx 설정 (멀티 아키텍처 및 고급 캐싱 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 소문자로 변환된 레포 이름 가공 (GHCR 규칙 준수)
      - name: Convert Repository Owner and Name to Lowercase
        id: repo_info
        run: |
          echo "owner=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "repo_name=${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      # Docker 이미지 빌드 및 GHCR 업로드
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_info.outputs.owner }}/${{ steps.repo_info.outputs.repo_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH 프로토콜 기반 대상 서버 접속 및 무중단 배포 가동
      - name: SSH Remote Connection and Container Re-deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # 작업 디렉토리 생성 및 이동
            mkdir -p ~/final-project
            cd ~/final-project
            
            # GHCR 최신 이미지 다운로드를 위해 원격 서버 내 GHCR 로그인 수행
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 운영 환경변수 파일 생성 (.env)
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
            
            # docker-compose.yml 다운로드 또는 갱신 복사 (배포 스크립트 내 인라인 생성)
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              db:
                image: mysql:8.0
                container_name: final-db
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
                  MYSQL_DATABASE: final
                  MYSQL_USER: ${DB_USERNAME}
                  MYSQL_PASSWORD: ${DB_PASSWORD}
                ports:
                  - "3306:3306"
                volumes:
                  - mysql_data:/var/lib/mysql
                command:
                  - --character-set-server=utf8mb4
                  - --collation-server=utf8mb4_unicode_ci
              app:
                image: ghcr.io/${{ steps.repo_info.outputs.owner }}/${{ steps.repo_info.outputs.repo_name }}:latest
                container_name: final-app
                restart: always
                ports:
                  - "8080:8080"
                environment:
                  DB_URL: jdbc:mysql://db:3306/final?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
                  DB_USERNAME: ${DB_USERNAME}
                  DB_PASSWORD: ${DB_PASSWORD}
                  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
                depends_on:
                  - db
            volumes:
              mysql_data:
            EOF
            
            # 최신 이미지 풀링 및 컨테이너 롤링 백그라운드 재구동
            docker compose pull
            docker compose up -d
            
            # 불필요한 레거시 이미지 정리 (서버 디스크 절약)
            docker image prune -f
            
            echo "Re-deployment successfully completed!"
